# Workflow Status Template
# This tracks progress through BMM methodology Analysis, Planning, and Solutioning phases.
# Implementation phase is tracked separately in sprint-status.yaml

# STATUS DEFINITIONS:
# ==================
# Initial Status (before completion):
#   - required: Must be completed to progress
#   - optional: Can be completed but not required
#   - recommended: Strongly suggested but not required
#   - conditional: Required only if certain conditions met (e.g., if_has_ui)
#
# Completion Status:
#   - {file-path}: File created/found (e.g., "docs/product-brief.md")
#   - skipped: Optional/conditional workflow that was skipped

generated: "2025-12-09"
project: "CIPP-Confluence"
project_type: "integration"
selected_track: "enterprise"
field_type: "brownfield"
workflow_path: "enterprise-brownfield.yaml"

workflow_status:
  # Prerequisite - Documentation (required for brownfield)
  - phase: "prerequisite"
    phase_name: "Documentation"
    workflows:
      - id: "document-project"
        status: "required"
        agent: "analyst"
        command: "/bmad:bmm:workflows:document-project"
        purpose: "Understand existing codebase - critical for enterprise brownfield"

  # Phase 0 - Discovery
  - phase: 0
    phase_name: "Discovery"
    workflows:
      - id: "brainstorm-project"
        status: "docs/analysis/brainstorming-session-2025-12-09.md"
        selected: true
        agent: "analyst"
        command: "/bmad:core:workflows:brainstorming-session"
        note: "Completed - ConfluenceAPI module design with ~34 functions"

      - id: "product-brief"
        status: "docs/analysis/product-brief-CIPP-Confluence-2025-12-09.md"
        agent: "analyst"
        command: "/bmad:bmm:workflows:create-product-brief"
        note: "Completed - Vision, users, metrics, MVP scope defined"

      - id: "research"
        status: "recommended"
        selected: false
        agent: "analyst"
        command: "/bmad:bmm:workflows:research"
        note: "Not selected - compliance, integration, risk research"

  # Phase 1 - Planning
  - phase: 1
    phase_name: "Planning"
    workflows:
      - id: "prd"
        status: "required"
        agent: "pm"
        command: "/bmad:bmm:workflows:create-prd"
        output: "Enterprise PRD with compliance requirements"

      - id: "create-ux-design"
        status: "recommended"
        agent: "ux-designer"
        command: "/bmad:bmm:workflows:create-ux-design"
        note: "Recommended - must integrate with existing UX patterns"

  # Phase 2 - Solutioning
  - phase: 2
    phase_name: "Solutioning"
    workflows:
      - id: "create-architecture"
        status: "required"
        agent: "architect"
        command: "/bmad:bmm:workflows:create-architecture"
        output: "Integration architecture with enterprise considerations"

      - id: "create-epics-and-stories"
        status: "required"
        agent: "pm"
        command: "/bmad:bmm:workflows:create-epics-stories"
        note: "Break down PRD into implementable epics and stories"

      - id: "test-design"
        status: "required"
        agent: "tea"
        command: "/bmad:bmm:workflows:testarch-test-design"
        output: "System-level testability review"

      - id: "validate-architecture"
        status: "recommended"
        agent: "architect"
        command: "/bmad:bmm:workflows:check-implementation-readiness"
        note: "Validate architecture decisions"

      - id: "implementation-readiness"
        status: "required"
        agent: "architect"
        command: "/bmad:bmm:workflows:check-implementation-readiness"
        note: "Validates PRD + Architecture + Epics + UX"

  # Phase 3 - Implementation
  - phase: 3
    phase_name: "Implementation"
    workflows:
      - id: "sprint-planning"
        status: "required"
        agent: "sm"
        command: "/bmad:bmm:workflows:sprint-planning"
        note: "Enterprise brownfield requires careful phasing and feature flags"
